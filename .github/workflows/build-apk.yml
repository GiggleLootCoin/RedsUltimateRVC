name: Build Red's Ultimate RVC APK

on:
  push:
    branches: [main, feature/rvc-dataset-export-zip, feature/native-ncnn-rvc-backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-ultimate-rvc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build and package the native GGUF runtime for an installable engineering APK.
  # Raw .pth export and physical-device qualification remain separate milestones.
  quality-guard:
    if: github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v5
      - name: Validate integration tooling and regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/brand.py tools/native/integrate.py tools/native/patch_spartacvc_ort_compat.py tools/native/patch_faiss_mobile.py
          bash -n tools/tests/check_pth_v2_profile.sh
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tools/tests

  pth-backend-probe:
    if: github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v5
      - name: Checkout pinned Apache-2.0 PTH inference core
        uses: actions/checkout@v5
        with:
          repository: f-cero/Spartacvc
          ref: c0b000778e5ff680ef0ab5b445d2ac583048d731
          path: spartacvc
      - name: Apply checked Spartacvc compatibility fixes for ONNX Runtime 1.28
        run: python3 tools/native/patch_spartacvc_ort_compat.py spartacvc
      - name: Cache a public RVC v2 PTH acceptance fixture
        uses: actions/cache@v4
        with:
          path: pth-fixtures
          key: red-rvc-pth-fixture-636cf49be6cac1e510523a4bff9daf90dc54e2a8a76b8fa1216db8f25332e01b-aether-49d261ca204ceebe19becd0304fb86d549b2f93eef03e222d95e492138823bc6
      - name: Verify real PTH checkpoint loading and architecture
        run: |
          set -euo pipefail
          mkdir -p pth-fixtures
          MODEL="pth-fixtures/nahida-jp.pth"
          if [ ! -s "$MODEL" ]; then
            curl --fail --location --retry 3 --silent --show-error \
              "https://huggingface.co/ArkanDash/rvc-genshin-impact/resolve/c49621f46b12e35309ba70cb1f64a0288e74a7b5/models/nahida-jp/nahida-jp.pth?download=true" \
              -o "$MODEL"
          fi
          echo "636cf49be6cac1e510523a4bff9daf90dc54e2a8a76b8fa1216db8f25332e01b  $MODEL" | sha256sum --check
          cc -std=c99 -O2 -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -DM_PI=3.14159265358979323846 -include sys/types.h -include unistd.h \
            -I spartacvc/src -I tools/native/rvc_pth_android \
            tools/native/rvc_pth_android/pth_check.c \
            spartacvc/src/debug.c spartacvc/src/pickle.c spartacvc/src/zip_reader.c \
            spartacvc/src/pth_loader.c spartacvc/src/rvc.c spartacvc/src/tensor.c \
            -lm -o pth-check
          ./pth-check "$MODEL"

      - name: Verify standard RVC v2 PTH feature profile
        run: bash tools/tests/check_pth_v2_profile.sh
      - name: Install Android NDK for ARM64 PTH runtime
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;23.1.7779620" "cmake;3.22.1"
      - name: Fetch matching ONNX Runtime headers and Android library
        run: |
          set -euo pipefail
          mkdir -p ort-headers ort-aar
          BASE="https://raw.githubusercontent.com/microsoft/onnxruntime/v1.28.0/include/onnxruntime/core/session"
          for header in onnxruntime_c_api.h onnxruntime_ep_c_api.h onnxruntime_error_code.h; do
            curl --fail --location --silent --show-error "$BASE/$header" -o "ort-headers/$header"
          done
          curl --fail --location --silent --show-error \
            "https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.28.0/onnxruntime-android-1.28.0.aar" \
            -o onnxruntime-android.aar
          unzip -q onnxruntime-android.aar -d ort-aar
          test -s ort-aar/jni/arm64-v8a/libonnxruntime.so
      - name: Prove end-to-end PTH conversion with real voice and feature models
        run: |
          set -euo pipefail
          ORT_ARCHIVE="/tmp/onnxruntime-linux-x64-1.28.0.tgz"
          ORT_ROOT="/tmp/onnxruntime-linux-x64-1.28.0"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz" \
            -o "$ORT_ARCHIVE"
          mkdir -p "$ORT_ROOT"
          tar -xzf "$ORT_ARCHIVE" -C /tmp
          test -s "$ORT_ROOT/lib/libonnxruntime.so"

          mkdir -p pth-fixtures/upstream-assets pth-fixtures/e2e
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/Sharl210/ultimate-rvc-mobile/releases/download/v2.0.0/app-release.apk" \
            -o pth-fixtures/upstream-assets/upstream.apk
          echo "2821b659bd113a8df7281b5ec2db1cccd3c524fcde68c93a7e46be44dba8e4b6  pth-fixtures/upstream-assets/upstream.apk" | sha256sum --check
          unzip -q pth-fixtures/upstream-assets/upstream.apk -d pth-fixtures/upstream-assets/extracted
          HUBERT="$(find pth-fixtures/upstream-assets/extracted -type f -name hubert.onnx -print -quit)"
          RMVPE="$(find pth-fixtures/upstream-assets/extracted -type f -name rmvpe.onnx -print -quit)"
          test -s "$HUBERT"
          test -s "$RMVPE"
          MODEL="pth-fixtures/aether/aether-rvc-v2.pth"
          test -s "$MODEL"

          cc -std=c99 -O2 -D_GNU_SOURCE -D_FILE_OFFSET_BITS=64 -DM_PI=3.14159265358979323846 \
            -include sys/types.h -include unistd.h \
            -I spartacvc/src -I tools/native/rvc_pth_android -I "$ORT_ROOT/include" \
            tools/native/rvc_pth_android/pth_convert_probe.c \
            tools/native/rvc_pth_android/pth_pipeline.c \
            tools/native/rvc_pth_android/threads_android.c \
            spartacvc/src/debug.c spartacvc/src/pickle.c spartacvc/src/zip_reader.c \
            spartacvc/src/pth_loader.c spartacvc/src/rvc.c spartacvc/src/rvc_infer.c \
            spartacvc/src/tensor.c spartacvc/src/onnx.c \
            -L "$ORT_ROOT/lib" -Wl,-rpath,"$ORT_ROOT/lib" -lonnxruntime -lm -pthread \
            -o pth-e2e-probe
          ./pth-e2e-probe "$MODEL" "$HUBERT" "$RMVPE" pth-fixtures/e2e

      - name: Cross-compile direct PTH-to-audio runtime for Android ARM64
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/23.1.7779620"
          cmake -S tools/native/rvc_pth_android -B pth-core-build \
            -DSPARTACVC_SOURCE_DIR="$GITHUB_WORKSPACE/spartacvc" \
            -DONNXRUNTIME_INCLUDE_DIR="$GITHUB_WORKSPACE/ort-headers" \
            -DONNXRUNTIME_LIBRARY="$GITHUB_WORKSPACE/ort-aar/jni/arm64-v8a/libonnxruntime.so" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build pth-core-build --parallel 2
          test -s pth-core-build/libred_rvc_pth.so
          mkdir -p pth-core-output
          cp pth-core-build/libred_rvc_pth.so pth-core-output/
          cp spartacvc/LICENSE pth-core-output/SPARTACVC-LICENSE.txt
      - name: Upload Android ARM64 PTH conversion runtime
        uses: actions/upload-artifact@v5
        with:
          name: red-rvc-pth-arm64
          path: pth-core-output/*
          if-no-files-found: error

  faiss-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v5

      - name: Set up Android NDK for FAISS
        uses: android-actions/setup-android@v4

      - name: Restore the pinned FAISS ARM64 AAR cache
        id: faiss-cache
        uses: actions/cache@v4
        with:
          path: tools/native/faiss/faiss-android.aar
          key: faiss-android-v1.14.1-arm64-ndk23.1-${{ hashFiles('tools/native/patch_faiss_mobile.py') }}

      - name: Build FAISS Android runtime with mobile-index exporter
        if: steps.faiss-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;23.1.7779620" "cmake;3.22.1"
          git clone --depth 1 --branch v1.14.1 --recurse-submodules \
            https://github.com/DeveloperMindset-com/faiss-mobile.git /tmp/faiss-mobile
          python3 tools/native/patch_faiss_mobile.py /tmp/faiss-mobile
          # OpenBLAS 0.3.28's optional CTest compiler check expands an unset
          # Fortran compiler ID into invalid CMake syntax when NOFORTRAN=ON.
          # Quote the expansion so the check evaluates safely on Android.
          mkdir -p /tmp/faiss-mobile/build-android/OpenBLAS
          curl --fail --location --silent --show-error \
            "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28.tar.gz" \
            -o /tmp/openblas-0.3.28.tar.gz
          tar -xzf /tmp/openblas-0.3.28.tar.gz --strip-components=1 \
            -C /tmp/faiss-mobile/build-android/OpenBLAS
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/faiss-mobile/build-android/OpenBLAS/ctest/CMakeLists.txt")
          s = p.read_text()
          old = "(${CMAKE_Fortran_COMPILER_ID} STREQUAL GNU)"
          new = '("${CMAKE_Fortran_COMPILER_ID}" STREQUAL GNU)'
          if s.count(old) != 4:
              raise SystemExit("OpenBLAS CTest compiler-check patch anchor changed")
          p.write_text(s.replace(old, new))
          PY
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/23.1.7779620"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          # The pinned mobile wrapper builds an older OpenBLAS CMake project.
          # CMake 4+ requires an explicit minimum policy compatibility version.
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          cd /tmp/faiss-mobile
          bash faiss-android.sh build --abi=arm64-v8a
          AAR="dist-android/faiss-android.aar"
          test -s "$AAR"
          # FAISS is linked with static libc++/OpenMP in this build. Avoid
          # duplicate libc++_shared.so packaging against Sherpa-ONNX.
          zip -d "$AAR" 'jni/*/libc++_shared.so' || true
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libfaiss_jni.so'
          unzip -l "$AAR" | grep -q 'classes.jar'
          ! unzip -l "$AAR" | grep -q 'libc++_shared.so'
          mkdir -p "$GITHUB_WORKSPACE/tools/native/faiss"
          cp "$AAR" "$GITHUB_WORKSPACE/tools/native/faiss/faiss-android.aar"

      - name: Verify native FAISS converter AAR
        run: |
          set -euo pipefail
          test -s tools/native/faiss/faiss-android.aar
          unzip -l tools/native/faiss/faiss-android.aar | grep -q 'jni/arm64-v8a/libfaiss_jni.so'
          unzip -l tools/native/faiss/faiss-android.aar | grep -q 'classes.jar'

      - name: Upload native FAISS Android runtime
        uses: actions/upload-artifact@v5
        with:
          name: red-rvc-faiss-arm64
          path: tools/native/faiss/faiss-android.aar
          if-no-files-found: error

  build:
    needs: [quality-guard, pth-backend-probe, faiss-android]
    if: always() && (needs.quality-guard.result == 'success' || needs.quality-guard.result == 'skipped') && (needs.pth-backend-probe.result == 'success' || needs.pth-backend-probe.result == 'skipped') && needs.faiss-android.result == 'success'
    runs-on: ubuntu-latest
    env:
      RED_RVC_KEYSTORE_BASE64: ${{ secrets.RED_RVC_KEYSTORE_BASE64 }}
      RED_RVC_STORE_PASSWORD: ${{ secrets.RED_RVC_STORE_PASSWORD }}
      RED_RVC_KEY_ALIAS: ${{ secrets.RED_RVC_KEY_ALIAS }}
      RED_RVC_KEY_PASSWORD: ${{ secrets.RED_RVC_KEY_PASSWORD }}
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v5

      - name: Download native PTH conversion runtime
        if: github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')
        uses: actions/download-artifact@v6
        with:
          name: red-rvc-pth-arm64
          path: native-output-pth

      - name: Download native FAISS index converter
        uses: actions/download-artifact@v6
        with:
          name: red-rvc-faiss-arm64
          path: tools/native/faiss

      - name: Checkout local RVC engine
        uses: actions/checkout@v5
        with:
          repository: Sharl210/ultimate-rvc-mobile
          ref: v2.0.0
          path: buildsrc

      - name: Checkout Sherpa-ONNX source-separation engine
        uses: actions/checkout@v5
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v1.13.8
          path: sherpa-onnx

      - name: Recover bundled base models from the verified upstream release
        run: |
          mkdir -p buildsrc/assets/models
          curl -L --fail --retry 3 -o upstream.apk https://github.com/Sharl210/ultimate-rvc-mobile/releases/download/v2.0.0/app-release.apk
          echo "2821b659bd113a8df7281b5ec2db1cccd3c524fcde68c93a7e46be44dba8e4b6  upstream.apk" | sha256sum --check
          unzip -q upstream.apk -d upstream_apk
          find upstream_apk -type f -name 'hubert.onnx' -exec cp {} buildsrc/assets/models/hubert.onnx \;
          find upstream_apk -type f -name 'rmvpe.onnx' -exec cp {} buildsrc/assets/models/rmvpe.onnx \;
          test -s buildsrc/assets/models/hubert.onnx
          test -s buildsrc/assets/models/rmvpe.onnx

      - name: Install logo renderer
        run: python3 -m pip install --quiet cairosvg

      - name: Apply Red's branding
        run: python3 tools/brand.py

      - name: Integrate offline song-cover and native PTH RVC bridge
        run: python3 tools/native/integrate.py

      - name: Set up Java 17 for the upstream Android Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the exact Android NDK and CMake required by upstream Gradle
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "cmake;3.22.1" "ndk;23.1.7779620"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          test -x "$ANDROID_HOME/ndk/23.1.7779620/ndk-build"

      - name: Build offline Spleeter engine for Android ARM64
        run: |
          set -eo pipefail
          export ANDROID_NDK="$ANDROID_HOME/ndk/23.1.7779620"
          test -x "$ANDROID_NDK/ndk-build"
          cd sherpa-onnx
          SHERPA_ONNX_ONNXRUNTIME_VERSION=1.28.0 \
          BUILD_SHARED_LIBS=ON \
          SHERPA_ONNX_ENABLE_C_API=ON \
          SHERPA_ONNX_ENABLE_JNI=OFF \
          SHERPA_ONNX_ENABLE_TTS=OFF \
          SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF \
          ./build-android-arm64-v8a.sh
          cd ..
          mkdir -p buildsrc/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p buildsrc/android/app/src/main/cpp/include/sherpa-onnx/c-api
          cp sherpa-onnx/build-android-arm64-v8a/install/lib/libsherpa-onnx-c-api.so buildsrc/android/app/src/main/jniLibs/arm64-v8a/
          cp "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" buildsrc/android/app/src/main/jniLibs/arm64-v8a/
          SHERPA_SO="buildsrc/android/app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          grep -q 'onnxruntime-android:1.28.0' buildsrc/android/app/build.gradle
          LLVM_NM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$LLVM_NM"
          "$LLVM_NM" -D --defined-only "$SHERPA_SO" | grep -q 'SherpaOnnxCreateOfflineSourceSeparation'
          "$LLVM_NM" -D --defined-only "$SHERPA_SO" | grep -q 'SherpaOnnxOfflineSourceSeparationProcess'
          readelf -d "$SHERPA_SO" | grep -q 'libonnxruntime.so' || {
            echo "Sherpa must link against the app's matching ONNX Runtime 1.28.0 library."
            exit 1
          }
          cp sherpa-onnx/sherpa-onnx/c-api/c-api.h buildsrc/android/app/src/main/cpp/include/sherpa-onnx/c-api/c-api.h
          curl -L --fail --retry 3 -o spleeter-models.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-fp16.tar.bz2
          mkdir -p spleeter-models
          tar -xjf spleeter-models.tar.bz2 -C spleeter-models
          VOCALS="$(find spleeter-models -type f -name vocals.fp16.onnx -print -quit)"
          ACCOMPANIMENT="$(find spleeter-models -type f -name accompaniment.fp16.onnx -print -quit)"
          test -s "$VOCALS"
          test -s "$ACCOMPANIMENT"
          mkdir -p buildsrc/assets/models/separation
          cp "$VOCALS" buildsrc/assets/models/separation/vocals.fp16.onnx
          cp "$ACCOMPANIMENT" buildsrc/assets/models/separation/accompaniment.fp16.onnx
          ls -lh buildsrc/assets/models/separation/

      - name: Install native PTH conversion runtime
        if: github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')
        run: |
          set -euo pipefail
          JNI_LIBS="buildsrc/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_LIBS" buildsrc/android/app/src/main/assets/licenses
          cp native-output-pth/libred_rvc_pth.so "$JNI_LIBS/"
          cp native-output-pth/SPARTACVC-LICENSE.txt buildsrc/android/app/src/main/assets/licenses/
          readelf -d "$JNI_LIBS/libred_rvc_pth.so" | grep -q 'libonnxruntime.so'
          test -s "$JNI_LIBS/libred_rvc_pth.so"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Configure persistent release signing key (optional)
        if: ${{ env.RED_RVC_KEYSTORE_BASE64 != '' }}
        working-directory: buildsrc
        env:
          RED_RVC_KEYSTORE_BASE64: ${{ secrets.RED_RVC_KEYSTORE_BASE64 }}
          RED_RVC_STORE_PASSWORD: ${{ secrets.RED_RVC_STORE_PASSWORD }}
          RED_RVC_KEY_ALIAS: ${{ secrets.RED_RVC_KEY_ALIAS }}
          RED_RVC_KEY_PASSWORD: ${{ secrets.RED_RVC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$RED_RVC_KEYSTORE_BASE64" | base64 --decode > android/app/red-release.jks
          cat > android/key.properties <<EOF
          storeFile=red-release.jks
          storePassword=$RED_RVC_STORE_PASSWORD
          keyAlias=$RED_RVC_KEY_ALIAS
          keyPassword=$RED_RVC_KEY_PASSWORD
          EOF
          keytool -list -keystore android/app/red-release.jks -storepass "$RED_RVC_STORE_PASSWORD" -alias "$RED_RVC_KEY_ALIAS" >/dev/null
          echo "Persistent private release signing key configured."

      - name: Warn when persistent release signing is not configured
        if: ${{ env.RED_RVC_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::Using the temporary GitHub runner debug key. APK upgrades may require uninstalling the previous build. Configure RED_RVC_KEYSTORE_BASE64, RED_RVC_STORE_PASSWORD, RED_RVC_KEY_ALIAS and RED_RVC_KEY_PASSWORD repository secrets for stable signing."

      - name: Flutter pub get
        working-directory: buildsrc
        run: flutter pub get

      - name: Verify Android toolchain
        working-directory: buildsrc
        run: flutter doctor -v

      - name: Analyze final Flutter source
        working-directory: buildsrc
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter widget and unit tests
        working-directory: buildsrc
        run: flutter test --reporter expanded

      - name: Validate Red's build finalizer and run project regression tests
        run: |
          python3 -m py_compile tools/brand.py tools/native/integrate.py
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tools/tests

      - name: Build ARM64 release APK
        working-directory: buildsrc
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Copy release APK
        run: |
          mkdir -p release
          cp buildsrc/build/app/outputs/flutter-apk/app-release.apk "release/Red-Ultimate-RVC.apk"
          sha256sum "release/Red-Ultimate-RVC.apk" > release/SHA256SUMS.txt

      - name: Verify APK alignment, signature and packaged size
        env:
          RVC_NATIVE_BACKEND_BUILD: ${{ (github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')) && 'true' || 'false' }}
        run: |
          APK="release/Red-Ultimate-RVC.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              files = sorted(((i.file_size, i.filename) for i in z.infolist() if not i.is_dir()), reverse=True)
              print(f"APK size: {apk.stat().st_size:,} bytes")
              print("Largest packaged files:")
              for size, name in files[:20]:
                  print(f"{size:>14,}  {name}")
              required_assets = (
                  "assets/flutter_assets/assets/models/hubert.onnx",
                  "assets/flutter_assets/assets/models/rmvpe.onnx",
                  "assets/flutter_assets/assets/models/separation/vocals.fp16.onnx",
                  "assets/flutter_assets/assets/models/separation/accompaniment.fp16.onnx",
                  "assets/flutter_assets/assets/FAISS THIRD-PARTY NOTICES.txt",
              )
              for required in required_assets:
                  if not any(i.filename.endswith(required) for i in z.infolist()):
                      raise SystemExit(f"Required offline inference asset missing: {required}")
              required_native = [
                  "lib/arm64-v8a/libred_source_separation.so",
                  "lib/arm64-v8a/libsherpa-onnx-c-api.so",
                  "lib/arm64-v8a/libonnxruntime.so",
                  "lib/arm64-v8a/libfaiss_jni.so",
              ]
              import os
              if os.environ.get("RVC_NATIVE_BACKEND_BUILD") == "true":
                  required_native.append("lib/arm64-v8a/libred_rvc_pth.so")
              for required in required_native:
                  matches = [i.filename for i in z.infolist() if i.filename.endswith(required)]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected exactly one packaged native library {required}; found {matches}")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Red-Ultimate-RVC-APK
          path: release/*

      # Feature-branch builds remain test artifacts. A public release is
      # deliberately restricted to main after the real-device acceptance gate.
      - name: Publish downloadable GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-preview-${{ github.run_number }}
          name: Red's Ultimate RVC v0.2.0 Preview (${{ github.run_number }})
          generate_release_notes: false
          body: |
            Red's Ultimate RVC — ARM64 Android engineering preview.

            Includes the Red dashboard, ONNX RVC inference, offline Spleeter song-cover pipeline, experimental native GGUF inference runner, realtime/voice-changer modules, and the voice-sample dataset workspace.

            Native PTH conversion is included for 768-dimensional, 100-fps RVC v2 checkpoints using bundled feature models; no user-supplied ONNX feature files are required. Standard 768-dimensional FAISS .index files can be converted locally to .mobile.index for compatible ONNX voice models. The direct PTH route does not yet apply retrieval-index blending. Physical Galaxy A12 runtime acceptance testing remains outstanding, so this is an engineering preview rather than a device-certified release.

            SHA-256 is provided in SHA256SUMS.txt.
          files: |
            release/Red-Ultimate-RVC.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
