name: Build Red's Ultimate RVC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v4

      - name: Checkout local RVC engine
        uses: actions/checkout@v4
        with:
          repository: Sharl210/ultimate-rvc-mobile
          ref: v2.0.0
          path: buildsrc

      - name: Recover bundled base models from the verified upstream release
        run: |
          mkdir -p buildsrc/assets/models
          curl -L --fail --retry 3 -o upstream.apk https://github.com/Sharl210/ultimate-rvc-mobile/releases/download/v2.0.0/app-release.apk
          unzip -q upstream.apk -d upstream_apk
          find upstream_apk -type f -name 'hubert.onnx' -exec cp {} buildsrc/assets/models/hubert.onnx \;
          find upstream_apk -type f -name 'rmvpe.onnx' -exec cp {} buildsrc/assets/models/rmvpe.onnx \;
          test -s buildsrc/assets/models/hubert.onnx
          test -s buildsrc/assets/models/rmvpe.onnx

      - name: Install logo renderer
        run: python3 -m pip install --quiet cairosvg

      - name: Apply Red's branding
        run: python3 tools/brand.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        working-directory: buildsrc
        run: flutter pub get

      - name: Verify Android toolchain
        working-directory: buildsrc
        run: flutter doctor -v

      - name: Static validation
        working-directory: buildsrc
        run: |
          test -s assets/models/hubert.onnx
          test -s assets/models/rmvpe.onnx
          grep -Fq "allowedExtensions: ['onnx', 'pth', 'pt', 'zip']" lib/screens/model_picker_screen.dart
          grep -Fq "allowedExtensions: ['index', 'mobile.index']" lib/screens/model_picker_screen.dart
          grep -q "Red.*Ultimate RVC" lib/main.dart
          grep -q "class RedHomeScreen" lib/screens/red_home_screen.dart
          grep -q "class TrainingScreen" lib/screens/training_screen.dart
          grep -q "import 'screens/red_home_screen.dart'" lib/main.dart

      - name: Build ARM64 release APK
        working-directory: buildsrc
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Copy release APK
        run: |
          mkdir -p release
          cp buildsrc/build/app/outputs/flutter-apk/app-release.apk "release/Red-Ultimate-RVC.apk"
          sha256sum "release/Red-Ultimate-RVC.apk" > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Red-Ultimate-RVC-APK
          path: release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          gh release create "$VERSION" "release/Red-Ultimate-RVC.apk" release/SHA256SUMS.txt --title "Red's Ultimate RVC $VERSION" --notes "Red's Ultimate RVC Android ARM64 build. Local RVC engine, branded for GiggleLootCoin." --latest
