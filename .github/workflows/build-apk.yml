name: Build Red's Ultimate RVC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RED_RVC_KEYSTORE_BASE64: ${{ secrets.RED_RVC_KEYSTORE_BASE64 }}
      RED_RVC_STORE_PASSWORD: ${{ secrets.RED_RVC_STORE_PASSWORD }}
      RED_RVC_KEY_ALIAS: ${{ secrets.RED_RVC_KEY_ALIAS }}
      RED_RVC_KEY_PASSWORD: ${{ secrets.RED_RVC_KEY_PASSWORD }}
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v5

      - name: Checkout local RVC engine
        uses: actions/checkout@v5
        with:
          repository: Sharl210/ultimate-rvc-mobile
          ref: v2.0.0
          path: buildsrc

      - name: Recover bundled base models from the verified upstream release
        run: |
          mkdir -p buildsrc/assets/models
          curl -L --fail --retry 3 -o upstream.apk https://github.com/Sharl210/ultimate-rvc-mobile/releases/download/v2.0.0/app-release.apk
          echo "2821b659bd113a8df7281b5ec2db1cccd3c524fcde68c93a7e46be44dba8e4b6  upstream.apk" | sha256sum --check
          unzip -q upstream.apk -d upstream_apk
          find upstream_apk -type f -name 'hubert.onnx' -exec cp {} buildsrc/assets/models/hubert.onnx \;
          find upstream_apk -type f -name 'rmvpe.onnx' -exec cp {} buildsrc/assets/models/rmvpe.onnx \;
          test -s buildsrc/assets/models/hubert.onnx
          test -s buildsrc/assets/models/rmvpe.onnx

      - name: Install logo renderer
        run: python3 -m pip install --quiet cairosvg

      - name: Apply Red's branding
        run: python3 tools/brand.py

      - name: Set up Java 17 for the upstream Android Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Configure persistent release signing key (optional)
        if: ${{ env.RED_RVC_KEYSTORE_BASE64 != '' }}
        working-directory: buildsrc
        env:
          RED_RVC_KEYSTORE_BASE64: ${{ secrets.RED_RVC_KEYSTORE_BASE64 }}
          RED_RVC_STORE_PASSWORD: ${{ secrets.RED_RVC_STORE_PASSWORD }}
          RED_RVC_KEY_ALIAS: ${{ secrets.RED_RVC_KEY_ALIAS }}
          RED_RVC_KEY_PASSWORD: ${{ secrets.RED_RVC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$RED_RVC_KEYSTORE_BASE64" | base64 --decode > android/app/red-release.jks
          cat > android/key.properties <<EOF
          storeFile=red-release.jks
          storePassword=$RED_RVC_STORE_PASSWORD
          keyAlias=$RED_RVC_KEY_ALIAS
          keyPassword=$RED_RVC_KEY_PASSWORD
          EOF
          keytool -list -keystore android/app/red-release.jks -storepass "$RED_RVC_STORE_PASSWORD" -alias "$RED_RVC_KEY_ALIAS" >/dev/null
          echo "Persistent private release signing key configured."

      - name: Warn when persistent release signing is not configured
        if: ${{ env.RED_RVC_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::Using the temporary GitHub runner debug key. APK upgrades may require uninstalling the previous build. Configure RED_RVC_KEYSTORE_BASE64, RED_RVC_STORE_PASSWORD, RED_RVC_KEY_ALIAS and RED_RVC_KEY_PASSWORD repository secrets for stable signing."

      - name: Flutter pub get
        working-directory: buildsrc
        run: flutter pub get

      - name: Verify Android toolchain
        working-directory: buildsrc
        run: flutter doctor -v

      - name: Analyze final Flutter source
        working-directory: buildsrc
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter widget and unit tests
        working-directory: buildsrc
        run: flutter test --reporter expanded

      - name: Validate Red's build finalizer and run project regression tests
        run: |
          python3 -m py_compile tools/brand.py
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tools/tests

      - name: Build ARM64 release APK
        working-directory: buildsrc
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Copy release APK
        run: |
          mkdir -p release
          cp buildsrc/build/app/outputs/flutter-apk/app-release.apk "release/Red-Ultimate-RVC.apk"
          sha256sum "release/Red-Ultimate-RVC.apk" > release/SHA256SUMS.txt

      - name: Verify APK alignment, signature and packaged size
        run: |
          APK="release/Red-Ultimate-RVC.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              files = sorted(((i.file_size, i.filename) for i in z.infolist() if not i.is_dir()), reverse=True)
              print(f"APK size: {apk.stat().st_size:,} bytes")
              print("Largest packaged files:")
              for size, name in files[:20]:
                  print(f"{size:>14,}  {name}")
              for required in ("assets/flutter_assets/assets/models/hubert.onnx", "assets/flutter_assets/assets/models/rmvpe.onnx"):
                  if not any(i.filename.endswith(required) for i in z.infolist()):
                      raise SystemExit(f"Required offline inference asset missing: {required}")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Red-Ultimate-RVC-APK
          path: release/*

      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-final-${{ github.run_number }}
          name: Red's Ultimate RVC v0.2.0 Final (${{ github.run_number }})
          generate_release_notes: false
          body: |
            Red's Ultimate RVC — ARM64 Android build.
            
            Includes the Red dashboard, model library, local ONNX inference, realtime/voice-changer modules, and an on-phone voice-sample dataset workspace. PTH conversion and neural-network RVC training are not included.
            
            SHA-256 is provided in SHA256SUMS.txt.
          files: |
            release/Red-Ultimate-RVC.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
