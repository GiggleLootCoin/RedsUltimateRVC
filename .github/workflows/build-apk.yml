name: Build Red's Ultimate RVC APK

on:
  push:
    branches: [main, feature/rvc-dataset-export-zip, feature/native-ncnn-rvc-backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-ultimate-rvc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build and package the native GGUF runtime for an installable engineering APK.
  # Raw .pth export and physical-device qualification remain separate milestones.
  native-backend-guard:
    if: github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native migration branch
        uses: actions/checkout@v5
      - name: Validate migration tooling and regression tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/brand.py tools/native/integrate.py
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tools/tests
          grep -q 'ON-DEVICE GGUF CONVERSION' tools/ui/model_converter_screen.dart
          grep -q 'convertGguf' tools/native/integrate.py
          grep -q 'RVC encoder/flow and NSF decoder' docs/NATIVE_RVC_BACKEND_MIGRATION.md
          echo 'Native GGUF runtime and Flutter conversion screen source checks passed; raw PTH export remains a disclosed limitation.'

      # Compile the independently developed, MIT-licensed C++ RVC inference core
      # for Android ARM64 before attempting to wire it into the application.
      - name: Checkout pinned RVC-GGML inference source
        uses: actions/checkout@v5
        with:
          repository: lainlives/rvc-ggml
          ref: 3b1a40b5386fe624367c859bd1ad5e7fd7b8508a
          path: rvc-ggml

      - name: Install Android NDK for ARM64 CPU build
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      - name: Cross-compile native RVC JNI runtime for Android ARM64 (CPU only)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S tools/native/rvc_ggml_android -B rvc-ggml-android-build -DRVC_GGML_SOURCE_DIR="$GITHUB_WORKSPACE/rvc-ggml/rvc-ggml" -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build rvc-ggml-android-build --target red_rvc_ggml --parallel 2
          mkdir -p native-output
          NATIVE_SO="$(find rvc-ggml-android-build -name 'libred_rvc_ggml.so' -size +0c -print -quit)"
          test -n "$NATIVE_SO"
          cp "$NATIVE_SO" native-output/libred_rvc_ggml.so
          test -s native-output/libred_rvc_ggml.so
      - name: Upload native ARM64 RVC runtime
        uses: actions/upload-artifact@v5
        with:
          name: red-rvc-ggml-arm64
          path: native-output/libred_rvc_ggml.so
          if-no-files-found: error

  build:
    needs: native-backend-guard
    if: always() && (needs.native-backend-guard.result == 'success' || needs.native-backend-guard.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      RED_RVC_KEYSTORE_BASE64: ${{ secrets.RED_RVC_KEYSTORE_BASE64 }}
      RED_RVC_STORE_PASSWORD: ${{ secrets.RED_RVC_STORE_PASSWORD }}
      RED_RVC_KEY_ALIAS: ${{ secrets.RED_RVC_KEY_ALIAS }}
      RED_RVC_KEY_PASSWORD: ${{ secrets.RED_RVC_KEY_PASSWORD }}
    steps:
      - name: Checkout Red's Ultimate RVC
        uses: actions/checkout@v5

      - name: Download native RVC runtime for native migration builds
        if: github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')
        uses: actions/download-artifact@v6
        with:
          name: red-rvc-ggml-arm64
          path: native-output

      - name: Checkout local RVC engine
        uses: actions/checkout@v5
        with:
          repository: Sharl210/ultimate-rvc-mobile
          ref: v2.0.0
          path: buildsrc

      - name: Checkout Sherpa-ONNX source-separation engine
        uses: actions/checkout@v5
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v1.13.8
          path: sherpa-onnx

      - name: Recover bundled base models from the verified upstream release
        run: |
          mkdir -p buildsrc/assets/models
          curl -L --fail --retry 3 -o upstream.apk https://github.com/Sharl210/ultimate-rvc-mobile/releases/download/v2.0.0/app-release.apk
          echo "2821b659bd113a8df7281b5ec2db1cccd3c524fcde68c93a7e46be44dba8e4b6  upstream.apk" | sha256sum --check
          unzip -q upstream.apk -d upstream_apk
          find upstream_apk -type f -name 'hubert.onnx' -exec cp {} buildsrc/assets/models/hubert.onnx \;
          find upstream_apk -type f -name 'rmvpe.onnx' -exec cp {} buildsrc/assets/models/rmvpe.onnx \;
          test -s buildsrc/assets/models/hubert.onnx
          test -s buildsrc/assets/models/rmvpe.onnx

      - name: Install logo renderer
        run: python3 -m pip install --quiet cairosvg

      - name: Apply Red's branding
        run: python3 tools/brand.py

      - name: Integrate offline song-cover and native RVC bridges
        env:
          RVC_GGML_ANDROID_SO: ${{ (github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')) && 'native-output/libred_rvc_ggml.so' || '' }}
        run: python3 tools/native/integrate.py

      - name: Set up Java 17 for the upstream Android Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the exact Android NDK and CMake required by upstream Gradle
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "cmake;3.22.1" "ndk;23.1.7779620"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          test -x "$ANDROID_HOME/ndk/23.1.7779620/ndk-build"

      - name: Build offline Spleeter engine for Android ARM64
        run: |
          set -eo pipefail
          export ANDROID_NDK="$ANDROID_HOME/ndk/23.1.7779620"
          test -x "$ANDROID_NDK/ndk-build"
          cd sherpa-onnx
          SHERPA_ONNX_ONNXRUNTIME_VERSION=1.28.0 \
          BUILD_SHARED_LIBS=ON \
          SHERPA_ONNX_ENABLE_C_API=ON \
          SHERPA_ONNX_ENABLE_JNI=OFF \
          SHERPA_ONNX_ENABLE_TTS=OFF \
          SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=OFF \
          ./build-android-arm64-v8a.sh
          cd ..
          mkdir -p buildsrc/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p buildsrc/android/app/src/main/cpp/include/sherpa-onnx/c-api
          cp sherpa-onnx/build-android-arm64-v8a/install/lib/libsherpa-onnx-c-api.so buildsrc/android/app/src/main/jniLibs/arm64-v8a/
          cp "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" buildsrc/android/app/src/main/jniLibs/arm64-v8a/
          SHERPA_SO="buildsrc/android/app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          grep -q 'onnxruntime-android:1.28.0' buildsrc/android/app/build.gradle
          LLVM_NM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$LLVM_NM"
          "$LLVM_NM" -D --defined-only "$SHERPA_SO" | grep -q 'SherpaOnnxCreateOfflineSourceSeparation'
          "$LLVM_NM" -D --defined-only "$SHERPA_SO" | grep -q 'SherpaOnnxOfflineSourceSeparationProcess'
          readelf -d "$SHERPA_SO" | grep -q 'libonnxruntime.so' || {
            echo "Sherpa must link against the app's matching ONNX Runtime 1.28.0 library."
            exit 1
          }
          cp sherpa-onnx/sherpa-onnx/c-api/c-api.h buildsrc/android/app/src/main/cpp/include/sherpa-onnx/c-api/c-api.h
          curl -L --fail --retry 3 -o spleeter-models.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/sherpa-onnx-spleeter-2stems-fp16.tar.bz2
          mkdir -p spleeter-models
          tar -xjf spleeter-models.tar.bz2 -C spleeter-models
          VOCALS="$(find spleeter-models -type f -name vocals.fp16.onnx -print -quit)"
          ACCOMPANIMENT="$(find spleeter-models -type f -name accompaniment.fp16.onnx -print -quit)"
          test -s "$VOCALS"
          test -s "$ACCOMPANIMENT"
          mkdir -p buildsrc/assets/models/separation
          cp "$VOCALS" buildsrc/assets/models/separation/vocals.fp16.onnx
          cp "$ACCOMPANIMENT" buildsrc/assets/models/separation/accompaniment.fp16.onnx
          ls -lh buildsrc/assets/models/separation/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Configure persistent release signing key (optional)
        if: ${{ env.RED_RVC_KEYSTORE_BASE64 != '' }}
        working-directory: buildsrc
        env:
          RED_RVC_KEYSTORE_BASE64: ${{ secrets.RED_RVC_KEYSTORE_BASE64 }}
          RED_RVC_STORE_PASSWORD: ${{ secrets.RED_RVC_STORE_PASSWORD }}
          RED_RVC_KEY_ALIAS: ${{ secrets.RED_RVC_KEY_ALIAS }}
          RED_RVC_KEY_PASSWORD: ${{ secrets.RED_RVC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$RED_RVC_KEYSTORE_BASE64" | base64 --decode > android/app/red-release.jks
          cat > android/key.properties <<EOF
          storeFile=red-release.jks
          storePassword=$RED_RVC_STORE_PASSWORD
          keyAlias=$RED_RVC_KEY_ALIAS
          keyPassword=$RED_RVC_KEY_PASSWORD
          EOF
          keytool -list -keystore android/app/red-release.jks -storepass "$RED_RVC_STORE_PASSWORD" -alias "$RED_RVC_KEY_ALIAS" >/dev/null
          echo "Persistent private release signing key configured."

      - name: Warn when persistent release signing is not configured
        if: ${{ env.RED_RVC_KEYSTORE_BASE64 == '' }}
        run: echo "::warning::Using the temporary GitHub runner debug key. APK upgrades may require uninstalling the previous build. Configure RED_RVC_KEYSTORE_BASE64, RED_RVC_STORE_PASSWORD, RED_RVC_KEY_ALIAS and RED_RVC_KEY_PASSWORD repository secrets for stable signing."

      - name: Flutter pub get
        working-directory: buildsrc
        run: flutter pub get

      - name: Verify Android toolchain
        working-directory: buildsrc
        run: flutter doctor -v

      - name: Analyze final Flutter source
        working-directory: buildsrc
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter widget and unit tests
        working-directory: buildsrc
        run: flutter test --reporter expanded

      - name: Validate Red's build finalizer and run project regression tests
        run: |
          python3 -m py_compile tools/brand.py tools/native/integrate.py
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tools/tests

      - name: Build ARM64 release APK
        working-directory: buildsrc
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Copy release APK
        run: |
          mkdir -p release
          cp buildsrc/build/app/outputs/flutter-apk/app-release.apk "release/Red-Ultimate-RVC.apk"
          sha256sum "release/Red-Ultimate-RVC.apk" > release/SHA256SUMS.txt

      - name: Verify APK alignment, signature and packaged size
        env:
          RVC_NATIVE_BACKEND_BUILD: ${{ (github.ref == 'refs/heads/feature/native-ncnn-rvc-backend' || (github.event_name == 'pull_request' && github.head_ref == 'feature/native-ncnn-rvc-backend')) && 'true' || 'false' }}
        run: |
          APK="release/Red-Ultimate-RVC.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              files = sorted(((i.file_size, i.filename) for i in z.infolist() if not i.is_dir()), reverse=True)
              print(f"APK size: {apk.stat().st_size:,} bytes")
              print("Largest packaged files:")
              for size, name in files[:20]:
                  print(f"{size:>14,}  {name}")
              required_assets = (
                  "assets/flutter_assets/assets/models/hubert.onnx",
                  "assets/flutter_assets/assets/models/rmvpe.onnx",
                  "assets/flutter_assets/assets/models/separation/vocals.fp16.onnx",
                  "assets/flutter_assets/assets/models/separation/accompaniment.fp16.onnx",
              )
              for required in required_assets:
                  if not any(i.filename.endswith(required) for i in z.infolist()):
                      raise SystemExit(f"Required offline inference asset missing: {required}")
              required_native = [
                  "lib/arm64-v8a/libred_source_separation.so",
                  "lib/arm64-v8a/libsherpa-onnx-c-api.so",
                  "lib/arm64-v8a/libonnxruntime.so",
              ]
              import os
              if os.environ.get("RVC_NATIVE_BACKEND_BUILD") == "true":
                  required_native.append("lib/arm64-v8a/libred_rvc_ggml.so")
              for required in required_native:
                  matches = [i.filename for i in z.infolist() if i.filename.endswith(required)]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected exactly one packaged native library {required}; found {matches}")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Red-Ultimate-RVC-APK
          path: release/*

      - name: Publish downloadable GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-final-${{ github.run_number }}
          name: Red's Ultimate RVC v0.2.0 Final (${{ github.run_number }})
          generate_release_notes: false
          body: |
            Red's Ultimate RVC — ARM64 Android build.
            
            Includes the Red dashboard, model library, local ONNX inference, realtime/voice-changer modules, and an on-phone voice-sample dataset workspace. PTH conversion and neural-network RVC training are not included.
            
            SHA-256 is provided in SHA256SUMS.txt.
          files: |
            release/Red-Ultimate-RVC.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
